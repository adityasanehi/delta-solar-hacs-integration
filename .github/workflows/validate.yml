name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so an upstream API or token change surfaces before users hit it.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
